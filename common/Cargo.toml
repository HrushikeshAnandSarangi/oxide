[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json", "std"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
redis = { version = "0.27", features = ["tokio-comp", "streams", "connection-manager"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
tokio = { version = "1.50.0", features = ["rt"] }

[lints]
workspace = true
